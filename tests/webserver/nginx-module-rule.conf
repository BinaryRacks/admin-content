# The nginx rule from docs/README.md (finding 1 fix), used by the web-server security test.
# Only the fastcgi_pass socket differs from the README (test server's PHP-FPM).
location ^~ /modules/addons/br_whatsapp/ {
    location = /modules/addons/br_whatsapp/webhook.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    return 404;
}
